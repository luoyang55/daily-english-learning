<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日英语学习 · Daily English</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--card:#14142a;--card2:#1a1a35;--accent:#6c63ff;--accent2:#8b83ff;--glow:rgba(108,99,255,.3);--text:#e8e8f0;--dim:#6a6a8a;--en:#c8c8e0;--cn:#8888aa;--border:#252545;--ok:#4ecdc4;--warn:#ffd93d;--morning:#ff6b6b;--afternoon:#4ecdc4}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(108,99,255,.06),transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(78,205,196,.04),transparent 50%);pointer-events:none}
.app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:20px 16px 40px}

/* Header */
.hdr{text-align:center;padding:24px 0 16px}
.hdr h1{font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--ok));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr .sub{color:var(--dim);font-size:13px;margin-top:4px}

/* Date nav */
.dnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0 20px}
.dnav button{background:var(--card);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;transition:.2s}
.dnav button:hover{background:var(--accent);border-color:var(--accent)}
.dnav .dt{font-size:17px;font-weight:600;min-width:170px;text-align:center}

/* Tabs */
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.tab{padding:9px 24px;border-radius:22px;border:2px solid var(--border);background:0 0;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer;transition:.3s}
.tab.on-m{border-color:var(--morning);color:var(--morning);background:rgba(255,107,107,.1)}
.tab.on-a{border-color:var(--afternoon);color:var(--afternoon);background:rgba(78,205,196,.1)}

/* Section card */
.sec{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.sec::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sec.morning::before{background:linear-gradient(90deg,var(--morning),#ff9a9e)}
.sec.afternoon::before{background:linear-gradient(90deg,var(--afternoon),#a8edea)}

/* Now playing header */
.np{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.album{width:60px;height:60px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.album.ma{background:linear-gradient(135deg,#ff6b6b,#ff9a9e)}
.album.aa{background:linear-gradient(135deg,#4ecdc4,#a8edea)}
.album.playing{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 18px 4px var(--glow)}}
.tinfo .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.tinfo .ttl{font-size:16px;font-weight:600}
.tinfo .ttlcn{font-size:12px;color:var(--dim);margin-top:2px}

/* Audio player row */
.arow{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.03);border-radius:10px;margin-bottom:6px}
.arow .ic{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.arow .al{font-size:12px;color:var(--dim);min-width:60px}
.arow audio{flex:1;height:36px}

/* Mode switch */
.modes{display:flex;gap:8px;margin:16px 0 12px}
.mode-btn{padding:6px 16px;border-radius:16px;border:1px solid var(--border);background:0 0;color:var(--dim);font-size:12px;cursor:pointer;transition:.2s}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* === KARAOKE MODE === */
.karaoke{padding:20px;background:var(--card2);border-radius:14px;line-height:2.2;min-height:200px}
.karaoke .w{display:inline;cursor:default;transition:all .15s;padding:1px 0;border-radius:3px;color:var(--dim);font-size:16px}
.karaoke .w.read{color:var(--en)}
.karaoke .w.active{color:#fff;background:var(--accent);padding:1px 4px;box-shadow:0 0 12px var(--glow);font-weight:600}
.karaoke .punct{color:var(--dim)}
.karaoke .sent{margin-bottom:6px;display:block}
.karaoke .sent-cn{display:block;font-size:13px;color:var(--cn);margin-bottom:14px;padding:6px 10px;background:rgba(78,205,196,.06);border-radius:6px;border-left:2px solid var(--ok)}

/* === READING MODE (bilingual paragraphs) === */
.para-pair{margin-bottom:18px;padding:16px;background:var(--card2);border-radius:12px;border:1px solid var(--border)}
.para-en{font-size:15px;line-height:1.9;color:var(--en);margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border)}
.para-cn{font-size:14px;line-height:1.9;color:var(--cn)}

/* === VOCAB FLASHCARD (万词王 style) === */
.fc-container{padding:20px 0}
.fc-progress{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.fc-progress .bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.fc-progress .bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:3px;transition:width .3s}
.fc-progress .cnt{font-size:12px;color:var(--dim);min-width:50px;text-align:right}

.fc-card{background:var(--card2);border-radius:16px;padding:28px 24px;text-align:center;margin-bottom:16px;border:1px solid var(--border);min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.fc-word{font-size:36px;font-weight:700;color:var(--text);margin-bottom:8px;cursor:pointer;transition:.2s}
.fc-word:hover{color:var(--accent2)}
.fc-phonetic{font-size:16px;color:var(--dim);margin-bottom:16px}
.fc-meaning{font-size:20px;color:var(--ok);margin-bottom:8px}
.fc-example{font-size:13px;color:var(--cn);max-width:400px;line-height:1.7;margin-top:12px;padding:12px;background:rgba(255,255,255,.03);border-radius:8px}
.fc-speak-btn{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:18px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.fc-speak-btn:hover{transform:scale(1.1);box-shadow:0 0 12px var(--glow)}

.fc-actions{display:flex;gap:12px;justify-content:center;margin-bottom:12px}
.fc-btn{padding:12px 28px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.fc-btn:hover{transform:translateY(-2px)}
.fc-btn.skip{background:rgba(255,107,107,.15);color:var(--morning);border:1px solid rgba(255,107,107,.3)}
.fc-btn.know{background:rgba(78,205,196,.15);color:var(--ok);border:1px solid rgba(78,205,196,.3)}
.fc-btn.prev{background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--border)}

/* Vocab list mode */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.v-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid transparent;transition:.2s;cursor:pointer}
.v-item:hover{background:rgba(108,99,255,.1);border-color:var(--accent)}
.v-item .vw{font-weight:600;color:var(--accent2);font-size:14px}
.v-item .vp{font-size:10px;color:var(--dim)}
.v-item .vm{font-size:12px;color:var(--cn)}
.v-item.mastered{opacity:.5}
.v-item.mastered .vw{text-decoration:line-through}

/* Key sentences */
.sec-title{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.s-card{padding:14px;background:rgba(255,255,255,.03);border-radius:10px;margin-bottom:8px;border:1px solid var(--border)}
.s-card .en{font-size:14px;color:var(--en);line-height:1.7;margin-bottom:4px}
.s-card .cn{font-size:13px;color:var(--cn);margin-bottom:6px}
.s-card .gr{font-size:11px;color:var(--warn);padding:4px 8px;background:rgba(255,217,61,.08);border-radius:5px;display:inline-block}

.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){.app{padding:10px 8px 30px}.sec{padding:18px 14px}.fc-word{font-size:28px}.karaoke .w{font-size:14px}.vocab-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <h1>📖 每日英语学习</h1>
    <div class="sub">Daily English · CET-4 Level · 四夕专属</div>
  </div>
  <div class="dnav">
    <button onclick="changeDate(-1)">◀</button>
    <div class="dt" id="curDate"></div>
    <button onclick="changeDate(1)">▶</button>
  </div>
  <div class="tabs">
    <button class="tab on-m" id="tM" onclick="switchTab('morning')">🌅 基础篇</button>
    <button class="tab" id="tA" onclick="switchTab('afternoon')">💼 IT工作篇</button>
  </div>
  <div id="main"></div>
</div>

<script>
// === DATA ===
const DATA={"date": "2026-07-24", "morning": {"title_en": "The Importance of Good Sleep", "title_cn": "良好睡眠的重要性", "level": "CET-4", "content_en": "Getting a good night's sleep is one of the most important things we can do for our health. Yet many people today struggle with sleep problems. According to recent studies, nearly one-third of adults do not get enough rest each night. This can lead to serious physical and mental health issues over time.\n\nScientists have found that sleep plays a key role in how our bodies repair themselves. During deep sleep, the body produces hormones that help muscles grow and tissues heal. The immune system also becomes stronger when we rest well. People who sleep less than six hours a night are more likely to catch colds and other infections.\n\nSleep also has a huge effect on our brain. While we sleep, the brain processes information from the day and stores it as long-term memories. This means that students who get enough rest before an exam often perform better than those who stay up all night studying. Lack of sleep can also make it harder to concentrate, solve problems, and make decisions.\n\nAnother important aspect is emotional health. When we are tired, we tend to feel more stressed and anxious. Research shows that poor sleep is closely linked to depression and mood disorders. On the other hand, a good night's rest can improve our mood and help us handle daily challenges with a more positive attitude.\n\nExperts suggest several ways to improve sleep quality. First, try to go to bed and wake up at the same time every day, even on weekends. Second, avoid using electronic devices at least thirty minutes before bedtime, because the blue light from screens can delay the release of melatonin, the hormone that helps us fall asleep. Third, create a comfortable sleeping environment by keeping the room cool, dark, and quiet. Finally, regular exercise during the day can help you fall asleep faster at night, but avoid working out too close to bedtime.\n\nIn conclusion, sleep is not a luxury but a basic need. Just like proper nutrition and regular exercise, adequate rest is essential for a healthy and balanced life. Making small changes to your daily routine can lead to significant improvements in both your physical and mental well-being.", "content_cn": "获得一夜好眠是我们可以为健康做的最重要的事情之一。然而，如今许多人都受到睡眠问题的困扰。根据最近的研究，近三分之一的成年人每晚得不到足够的休息。随着时间的推移，这可能导致严重的身体和心理健康问题。\n\n科学家发现，睡眠在我们身体的自我修复过程中起着关键作用。在深度睡眠期间，身体会产生帮助肌肉生长和组织愈合的激素。当我们休息良好时，免疫系统也会变得更强壮。每晚睡眠少于六小时的人更容易感冒和感染其他疾病。\n\n睡眠对我们的大脑也有巨大影响。在我们睡觉时，大脑会处理白天的信息并将其储存为长期记忆。这意味着在考试前得到充足休息的学生往往比通宵学习的学生表现更好。缺乏睡眠还会使我们更难集中注意力、解决问题和做出决定。\n\n另一个重要方面是情绪健康。当我们疲倦时，往往感到更大的压力和焦虑。研究表明，睡眠质量差与抑郁症和情绪障碍密切相关。另一方面，一夜好的休息可以改善我们的情绪，帮助我们以更积极的态度应对日常挑战。\n\n专家建议了几种提高睡眠质量的方法。首先，尽量每天在同一时间上床睡觉和起床，即使在周末也是如此。其次，至少在睡前三十分钟避免使用电子设备，因为屏幕发出的蓝光会延迟褪黑素的释放，而褪黑素是帮助我们入睡的激素。第三，通过保持房间凉爽、黑暗和安静来创造舒适的睡眠环境。最后，白天定期运动可以帮助你更快入睡，但要避免在接近睡觉时间锻炼。\n\n总之，睡眠不是一种奢侈，而是基本需求。就像适当的营养和规律的运动一样，充足的休息对于健康平衡的生活至关重要。对日常作息做一些小的改变，就能在身体和精神健康方面带来显著的改善。", "vocabulary": [{"word": "struggle", "phonetic": "/ˈstrʌɡl/", "meaning": "挣扎，艰难地做"}, {"word": "hormone", "phonetic": "/ˈhɔːrmoʊn/", "meaning": "激素，荷尔蒙"}, {"word": "immune", "phonetic": "/ɪˈmjuːn/", "meaning": "免疫的"}, {"word": "infection", "phonetic": "/ɪnˈfekʃn/", "meaning": "感染，传染病"}, {"word": "concentrate", "phonetic": "/ˈkɒnsntreɪt/", "meaning": "集中注意力"}, {"word": "emotional", "phonetic": "/ɪˈmoʊʃənl/", "meaning": "情绪的，情感的"}, {"word": "anxious", "phonetic": "/ˈæŋkʃəs/", "meaning": "焦虑的，不安的"}, {"word": "depression", "phonetic": "/dɪˈpreʃn/", "meaning": "抑郁，沮丧"}, {"word": "melatonin", "phonetic": "/ˌmeləˈtoʊnɪn/", "meaning": "褪黑素"}, {"word": "nutrition", "phonetic": "/nuˈtrɪʃn/", "meaning": "营养，营养学"}], "key_sentences": [{"en": "During deep sleep, the body produces hormones that help muscles grow and tissues heal.", "cn": "在深度睡眠期间，身体会产生帮助肌肉生长和组织愈合的激素。", "grammar": "that 引导定语从句修饰 hormones；help 后接宾语 muscles/tissues 和不带 to 的不定式 grow/heal 作宾补。"}, {"en": "This means that students who get enough rest before an exam often perform better than those who stay up all night studying.", "cn": "这意味着在考试前得到充足休息的学生往往比通宵学习的学生表现更好。", "grammar": "that 引导宾语从句；who 引导两个定语从句分别修饰 students 和 those；perform better than 为比较级结构。"}, {"en": "Avoid using electronic devices at least thirty minutes before bedtime, because the blue light from screens can delay the release of melatonin, the hormone that helps us fall asleep.", "cn": "至少在睡前三十分钟避免使用电子设备，因为屏幕发出的蓝光会延迟褪黑素的释放，而褪黑素是帮助我们入睡的激素。", "grammar": "because 引导原因状语从句；the hormone 是 melatonin 的同位语；最后一个 that 引导定语从句修饰 the hormone。"}]}, "afternoon": {"title_en": "How AI Agents Are Automating Smart Grid Operations", "title_cn": "AI智能体如何自动化电网运营", "level": "IT工作篇", "content_en": "The power grid is one of the most complex systems ever built by humanity. Every second, supply and demand must stay perfectly balanced across thousands of miles of transmission lines. Today, a new technology is helping grid operators manage this complexity: autonomous AI agents.\n\nUnlike traditional software that follows fixed rules, AI agents can observe their environment, make decisions, and take actions to achieve specific goals. In the context of smart grids, these agents monitor real-time data from sensors, weather stations, and market platforms. When they detect a potential imbalance, such as a sudden drop in solar output due to cloud cover, they can automatically adjust battery storage, reroute power flows, or activate demand response programs within milliseconds.\n\nOne promising application is distributed energy resource management. As more homes install rooftop solar panels and battery systems, the grid faces a growing challenge: millions of small generators that can inject or withdraw power unpredictably. AI agents can coordinate these distributed resources by creating virtual power plants that aggregate thousands of devices and operate them as a single controllable unit.\n\nAnother area where agents excel is predictive maintenance. Instead of scheduling inspections on fixed calendars, AI agents continuously analyze vibration data, thermal images, and acoustic signals from transformers and substations. They learn to recognize patterns that precede equipment failures and can dispatch repair crews before outages occur. This approach has been shown to reduce unplanned downtime by up to forty percent in pilot projects.\n\nCybersecurity is also being transformed by AI agents. Grid operators face constant threats from hackers who could disrupt power to entire cities. Autonomous defense agents patrol the network around the clock, detecting suspicious traffic patterns and isolating compromised segments before attacks spread. These systems can respond faster than any human analyst, making them essential for critical infrastructure protection.\n\nLooking ahead, the grid of the future will likely operate as a multi-agent system where hundreds of specialized AI agents collaborate in real time. Some will optimize energy trading, others will manage load balancing, and still others will ensure regulatory compliance. For B-end product managers in the energy sector, understanding how to design platforms that support these intelligent agents is becoming a core competency.", "content_cn": "电网是人类建造的最复杂的系统之一。每一秒，供需关系都必须在数千英里的输电线路上保持完美平衡。如今，一项新技术正在帮助电网运营商管理这种复杂性：自主AI智能体。\n\n与传统遵循固定规则的软件不同，AI智能体能够观察环境、做出决策并采取行动来实现特定目标。在智能电网场景中，这些智能体监控来自传感器、气象站和市场平台的实时数据。当检测到潜在的不平衡——例如太阳能输出因云层遮挡而突然下降——它们可以在毫秒内自动调整电池储能、重新路由电力流或激活需求响应程序。\n\n一个有前景的应用是分布式能源资源管理。随着越来越多的家庭安装屋顶太阳能板和电池系统，电网面临着一个日益增长的挑战：数百万个可能不可预测地注入或撤回电力的小型发电机。AI智能体可以通过创建虚拟电厂来协调这些分布式资源，将数千台设备聚合起来，作为一个可控单元来运营。\n\nAI智能体擅长的另一个领域是预测性维护。AI智能体不再按照固定日历安排检查，而是持续分析变压器和变电站的振动数据、热成像和声学信号。它们学会识别设备故障前的模式，可以在停电发生前派遣维修人员。试点项目表明，这种方法可将计划外停机时间减少多达40%。\n\n网络安全也在被AI智能体所改变。电网运营商面临着黑客可能中断整个城市供电的持续威胁。自主防御智能体全天候巡视网络，检测可疑流量模式，并在攻击蔓延前隔离受损区域。这些系统的响应速度超过任何人类分析师，使其成为关键基础设施保护的必要工具。\n\n展望未来，未来的电网可能作为一个多智能体系统运营，数百个专业化AI智能体实时协作。有的优化能源交易，有的管理负载均衡，还有的确保法规合规。对于能源领域的B端产品经理来说，理解如何设计支持这些智能智能体的平台正在成为一项核心能力。", "vocabulary": [{"word": "autonomou     return AUDIO_SRC[key];
  });
}

function fmtDate(){return '2026年7月24日 周五'}
function switchTab(t){
  currentTab=t;
  document.getElementById('tM').className='tab'+(t==='morning'?' on-m':'');
  document.getElementById('tA').className='tab'+(t==='afternoon'?' on-a':'');
  stopAudio();
  render();
}
function changeDate(d){alert('当前只有 2026年7月24日 周五 的内容，明天会自动更新~')}

function stopAudio(){
  if(audioEl){audioEl.pause();audioEl=null}
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null}
}

function setPlaying(v){
  const a=document.getElementById('album');
  if(a){v?a.classList.add('playing'):a.classList.remove('playing')}
}

// === RENDER ===
function render(){
  const d=DATA[currentTab];
  const isM=currentTab==='morning';
  const cls=isM?'morning':'afternoon';
  const acls=isM?'ma':'aa';
  const emoji=isM?'🌅':'💼';
  
  document.getElementById('curDate').textContent=fmtDate();
  document.getElementById('main').innerHTML=`
    <div class="fade-in">
      <div class="sec ${cls}">
        <div class="np">
          <div class="album ${acls}" id="album">${emoji}</div>
          <div class="tinfo">
            <div class="lbl">${d.level} · ${fmtDate()}</div>
            <div class="ttl">${d.title_en}</div>
            <div class="ttlcn">${d.title_cn}</div>
          </div>
        </div>
        <div class="arow">
          <div class="ic">🇺🇸</div>
          <div class="al">英文朗读</div>
          <audio id="enAudio" controls preload="auto" onplay="onEnPlay()" onpause="setPlaying(false)" onended="onEnEnd()"></audio>
        </div>
        <div class="arow">
          <div class="ic">🇨🇳</div>
          <div class="al">中文讲解</div>
          <audio id="cnAudio" controls preload="auto" onplay="setPlaying(true)" onpause="setPlaying(false)" onended="setPlaying(false)"></audio>
        </div>
      </div>
      
      <div class="modes" id="modesBar">
        <button class="mode-btn active" id="modeKaraoke" onclick="setMode('karaoke')">🎤 跟读模式</button>
        <button class="mode-btn" id="modeReading" onclick="setMode('reading')">📖 阅读模式</button>
      </div>
      
      <div id="contentView"></div>
      
      <div style="margin-top:16px">
        <div class="modes">
          <button class="mode-btn active" id="modeFC" onclick="setVocabMode('flashcard')">🃏 单词卡片</button>
          <button class="mode-btn" id="modeList" onclick="setVocabMode('list')">📋 词汇表</button>
        </div>
        <div id="vocabView"></div>
      </div>
      
      <div style="margin-top:16px">
        <div class="sec-title">💡 重点句子</div>
        ${d.key_sentences.map(s=>`
          <div class="s-card">
            <div class="en">${s.en}</div>
            <div class="cn">${s.cn}</div>
            <div class="gr">📌 ${s.grammar}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  
  // Load audio sources
  loadAudio(currentTab+'_en').then(src=>{document.getElementById('enAudio').src=src});
  loadAudio(currentTab+'_cn_teach').then(src=>{document.getElementById('cnAudio').src=src});
  
  currentVocabIdx=0;
  masteredWords=new Set();
  renderContent();
  renderVocab();
}

function setMode(m){
  viewMode=m;
  document.getElementById('modeKaraoke').className='mode-btn'+(m==='karaoke'?' active':'');
  document.getElementById('modeReading').className='mode-btn'+(m==='reading'?' active':'');
  renderContent();
}

function splitParas(text){return text.split(/\n\n+/).filter(p=>p.trim())}

function renderContent(){
  const d=DATA[currentTab];
  const cv=document.getElementById('contentView');
  if(!cv)return;
  
  const enParas=splitParas(d.content_en);
  const cnParas=splitParas(d.content_cn);
  const t=DATA.timing[currentTab];
  
  // Map timing sentences to paragraph indices
  let sentIdx=0;
  const sentParaMap=[];
  enParas.forEach((para,pi)=>{
    const paraSents=para.match(/[^.!?]+[.!?]+/g)||[para];
    paraSents.forEach(()=>{sentParaMap.push(pi);sentIdx++});
  });
  
  if(viewMode==='karaoke'){
    let html='<div class="karaoke" id="karaokeBox">';
    let lastPara=-1;
    t.forEach((sent,si)=>{
      const pi=sentParaMap[si]!==undefined?sentParaMap[si]:enParas.length-1;
      if(pi!==lastPara){
        if(lastPara>=0&&cnParas[lastPara]){
          html+='<span class="sent-cn">'+cnParas[lastPara]+'</span>';
        }
        lastPara=pi;
      }
      html+='<span class="sent">';
      sent.words.forEach((w,wi)=>{
        html+=`<span class="w" data-t="${w.start}" data-e="${w.end}" data-s="${si}" data-wi="${wi}">${w.word}</span> `;
      });
      html+='</span>';
    });
    if(lastPara>=0&&cnParas[lastPara]){
      html+='<span class="sent-cn">'+cnParas[lastPara]+'</span>';
    }
    html+='</div>';
    cv.innerHTML=html;
  } else {
    let html='';
    enParas.forEach((enP,i)=>{
      html+='<div class="para-pair">';
      html+='<div class="para-en">'+enP+'</div>';
      if(cnParas[i]) html+='<div class="para-cn">'+cnParas[i]+'</div>';
      html+='</div>';
    });
    cv.innerHTML=html;
  }
}

// === KARAOKE SYNC ===
function onEnPlay(){
  setPlaying(true);
  audioEl=document.getElementById('enAudio');
  syncLoop();
}
function onEnEnd(){
  setPlaying(false);
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null}
  // Reset all words
  document.querySelectorAll('.karaoke .w').forEach(w=>{
    w.classList.remove('active','read');
  });
}

function syncLoop(){
  if(!audioEl||audioEl.paused)return;
  const t=audioEl.currentTime;
  const words=document.querySelectorAll('.karaoke .w');
  let activeIdx=-1;
  
  words.forEach((el,i)=>{
    const start=parseFloat(el.dataset.t);
    const end=parseFloat(el.dataset.e);
    if(t>=start&&t<end){
      el.classList.add('active');
      el.classList.add('read');
      activeIdx=i;
    } else if(t>=end){
      el.classList.remove('active');
      el.classList.add('read');
    } else {
      el.classList.remove('active','read');
    }
  });
  
  // Auto scroll to active word
  if(activeIdx>=0){
    const activeEl=words[activeIdx];
    const box=document.getElementById('karaokeBox');
    if(box&&activeEl){
      const elTop=activeEl.offsetTop-box.offsetTop;
      const boxH=box.clientHeight;
      if(elTop>boxH*0.6){
        box.scrollTop=elTop-boxH*0.3;
      }
    }
  }
  
  animFrame=requestAnimationFrame(syncLoop);
}

// === VOCAB FLASHCARD ===
function setVocabMode(m){
  vocabMode=m;
  document.getElementById('modeFC').className='mode-btn'+(m==='flashcard'?' active':'');
  document.getElementById('modeList').className='mode-btn'+(m==='list'?' active':'');
  renderVocab();
}

function renderVocab(){
  const d=DATA[currentTab];
  const vv=d.vocabulary;
  const container=document.getElementById('vocabView');
  if(!container)return;
  
  if(vocabMode==='flashcard'){
    const v=vv[currentVocabIdx];
    const pct=((currentVocabIdx+1)/vv.length*100).toFixed(0);
    const isMastered=masteredWords.has(v.word);
    container.innerHTML=`
      <div class="fc-container">
        <div class="fc-progress">
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
          <div class="cnt">${currentVocabIdx+1}/${vv.length}</div>
        </div>
        <div class="fc-card">
          <button class="fc-speak-btn" onclick="speakWord('${v.word}')">🔊</button>
          <div class="fc-word" onclick="speakWord('${v.word}')">${v.word}</div>
          <div class="fc-phonetic">${v.phonetic}</div>
          <div class="fc-meaning">${v.meaning}</div>
          ${isMastered?'<div style="color:var(--ok);font-size:12px;margin-top:8px">✅ 已掌握</div>':''}
        </div>
        <div class="fc-actions">
          <button class="fc-btn prev" onclick="vocabPrev()" ${currentVocabIdx===0?'disabled':''}>⬅ 上一个</button>
          <button class="fc-btn skip" onclick="vocabSkip()">😅 不熟</button>
          <button class="fc-btn know" onclick="vocabKnow()">✅ 掌握了</button>
        </div>
      </div>
    `;
  } else {
    container.innerHTML=`
      <div class="vocab-grid">
        ${vv.map(v=>`
          <div class="v-item ${masteredWords.has(v.word)?'mastered':''}" onclick="speakWord('${v.word}')">
            <div>
              <div class="vw">${v.word}</div>
              <div class="vp">${v.phonetic}</div>
            </div>
            <div class="vm">${v.meaning}</div>
          </div>
        `).join('')}
      </div>
      <div style="text-align:center;margin-top:12px;color:var(--dim);font-size:12px">
        已掌握 ${masteredWords.size}/${vv.length} 个单词
      </div>
    `;
  }
}

function vocabNext(){
  const vv=DATA[currentTab].vocabulary;
  if(currentVocabIdx<vv.length-1){currentVocabIdx++;renderVocab()}
}
function vocabPrev(){
  if(currentVocabIdx>0){currentVocabIdx--;renderVocab()}
}
function vocabSkip(){vocabNext()}
function vocabKnow(){
  const v=DATA[currentTab].vocabulary[currentVocabIdx];
  masteredWords.add(v.word);
  vocabNext();
}

function speakWord(w){
  const u=new SpeechSynthesisUtterance(w);
  u.lang='en-US';u.rate=0.8;
  speechSynthesis.speak(u);
}

// Init
render();
</script>
